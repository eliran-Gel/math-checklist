<style>
:root{--bg:#f7f8f6;--card:#fff;--ink:#1d2b2a;--mute:#6b7a78;--line:#dde3e0;--accent:#1f7a6d;--accentbg:#e3f2ef;--bar:#dde3e0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121816;--card:#1a2321;--ink:#e6eeec;--mute:#92a29f;--line:#2b3735;--accent:#4fc2b0;--accentbg:#1d3531;--bar:#2b3735}}
:root[data-theme="dark"]{--bg:#121816;--card:#1a2321;--ink:#e6eeec;--mute:#92a29f;--line:#2b3735;--accent:#4fc2b0;--accentbg:#1d3531;--bar:#2b3735}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Heebo,"Segoe UI",Arial,sans-serif;line-height:1.5}
main{max-width:860px;margin:0 auto;padding:20px 14px 48px}
h1{font-size:1.5rem;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 16px;font-size:.92rem}
.bar{height:8px;background:var(--bar);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.stat{font-size:.88rem;color:var(--mute);margin:6px 0 0}
.top{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:22px}
h2{font-size:1.2rem;margin:26px 0 6px}
details{background:var(--card);border:1px solid var(--line);border-radius:8px;margin:8px 0}
summary{cursor:pointer;padding:11px 14px;font-weight:500;display:flex;justify-content:space-between;gap:10px}
summary:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
summary span{color:var(--mute);font-weight:400;font-size:.88rem;white-space:nowrap}
ul{list-style:none;margin:0;padding:0 14px 8px}
li{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
label{display:flex;gap:9px;align-items:flex-start;flex:1 1 250px;cursor:pointer}
input[type=checkbox]{width:19px;height:19px;margin:3px 0 0;accent-color:var(--accent);flex:none}
.h{color:var(--mute);font-size:.82rem;margin-top:3px}
li.d .t{color:var(--mute);text-decoration:line-through}
textarea{flex:1 1 220px;min-height:34px;field-sizing:content;resize:vertical;font:inherit;font-size:.9rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
textarea::placeholder{color:var(--mute)}
button{font:inherit;font-size:.85rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

<body>
<main>
<h1>צ׳ק ליסט – סילבוס מתמטיקה 5 יחידות</h1>
<p class="sub">סמנו מה כבר נלמד, וכתבו הערות לכל תת-נושא. הכול נשמר בדפדפן הזה. השעות הן המלצת הסילבוס (למידה + תרגול).</p>
<div class="top"><div class="bar"><i id="pb"></i></div><p class="stat" id="ps"></p><p class="stat" id="sv"></p><p class="stat"><button id="ex" type="button">גיבוי לקובץ</button> <button id="im" type="button">שחזור מגיבוי</button><input id="fi" type="file" accept=".json,application/json" hidden></p></div>
<div id="app"></div>
</main>
<script>
const D=[
["כיתה י׳",[
["א. אלגברה ומבוא לפונקציות",["חזקות ושורשים|3","פירוק לגורמים ונוסחאות כפל מקוצר|3","משוואות ואי-שוויונות|3","פונקציה קווית וריבועית – חזרה והעמקה|3","תחום הגדרה וטווח|3","חיתוך עם הצירים וסימן הפונקציה|2","פעולות על פונקציות|4","הרכבת פונקציות ופונקציה הפוכה|4","הזזות, שיקופים ומתיחות של גרפים|3","פונקציות שורש ורציונליות בסיסיות|4"]],
["ב. מבוא להנדסה אנליטית",["מערכת צירים ונקודות|2","שיפוע ומשוואת ישר|3","חיתוך ישרים ומערכות משוואות|3","אמצע קטע ומרחק בין נקודות|3","ניצבות ומקבילות|2","מעגל קנוני וכללי – מבוא|3"]],
["ג. סדרות",["מושג הסדרה וחוקיות|2","סדרה חשבונית|4","איבר כללי וסכום סדרה חשבונית|3","סדרה הנדסית|4","סכום סדרה הנדסית|3","בעיות מילוליות ויישומים|2"]],
["ד. חשבון דיפרנציאלי – יסודות",["קצב שינוי ממוצע וקצב שינוי רגעי|3","שיפוע המשיק|3","מושג הנגזרת והגדרתה|4","נגזרת של פולינומים|4","משוואת משיק|3","קשר בין גרף הפונקציה לגרף הנגזרת|4","נקודות קיצון ותחומי עלייה וירידה|5","חקירת פונקציות פולינומיות|5"]],
["ה. גאומטריה אוקלידית",["מערכת הוכחה, טענה ונימוק|4","זוויות וישרים|3","משולשים ותכונותיהם|5","חפיפת משולשים|5","תיכון, גובה וחוצה זווית|3","נקודות מיוחדות במשולש|3","מקומות גאומטריים|4","משפטים במעגל|7","פרופורציה ותאלס|4","דמיון משולשים|5"]],
["ו. פונקציות טריגונומטריות – מבוא",["מעגל היחידה|4","הגדרת סינוס וקוסינוס|3","טנגנס ותכונות הפונקציות|3","מחזוריות וסימטריה|3","גרפים של פונקציות טריגונומטריות|3"]]
]],
["כיתה י״א",[
["א. אינדוקציה מתמטית",["רעיון האינדוקציה והמבנה הלוגי|2","בסיס האינדוקציה|2","הנחת האינדוקציה וצעד המעבר|3","הוכחת סכומים|3","הוכחת אי-שוויונות|3","סדרות כלליות ונוסחאות נסיגה|3"]],
["ב. סדרות – העמקה",["סדרה הנדסית – חזרה והעמקה|3","סדרה הנדסית אינסופית מתכנסת|4","סדרות כלליות ונוסחת נסיגה|3","סדרות משולבות ושאלות פרמטרים|3"]],
["ג. הסתברות",["מרחב מדגם ומאורעות|2","חוקי הסתברות|3","מאורעות זרים ומשלימים|2","מאורעות תלויים ובלתי תלויים|4","הסתברות מותנית|4","טבלת הסתברויות דו-ממדית|3","עץ הסתברויות|3","נוסחת בייס|2","ניסויים חוזרים והתפלגות בינומית (ברנולי)|4","שאלות מורכבות|3"]],
["ד. טריגונומטריה במישור",["יחסים במשולש ישר זווית|3","זהויות טריגונומטריות|5","משוואות טריגונומטריות|5","משפט הסינוסים|3","משפט הקוסינוסים|3","שטח משולש|2","שאלות גאומטריות משולבות|3"]],
["ה. חדו״א – השלמת שאלון 571",["חזרה על נגזרות פולינומיות|3","נגזרות של פונקציות שורש|4","נגזרות של פונקציות רציונליות|5","נגזרת שנייה, קעירות וקמירות|4","נקודות פיתול|3","חקירת פונקציות שורש ורציונליות|5","בעיות קיצון|5","נגזרות של פונקציות טריגונומטריות|4","חקירת פונקציות טריגונומטריות|5"]],
["ו. אינטגרלים",["משמעות הפונקציה הקדומה|2","אינטגרלים בסיסיים|3","אינטגרל מסוים|3","הקשר בין נגזרת לאינטגרל|2","פונקציית הצטברות|2","שטחים בין גרפים ובין גרף לציר|5"]],
["ז. הכנה לשאלון 571",["שאלות קצרות משולבות|3","שאלות סדרות ואינדוקציה|3","שאלות הסתברות|3","גאומטריה וטריגונומטריה|3","שאלות חדו״א מלאות|4","בחינות מלאות וניתוח טעויות|6"]]
]],
["כיתה י״ב",[
["א. גאומטריה אנליטית",["חזרה על ישרים ושיפועים|2","מרחק בין נקודות ומרחק מנקודה לישר|4","מצבים הדדיים של ישרים|3","משוואת המעגל|4","חיתוך ישר ומעגל|3","פרבולה|4","אליפסה|4","היפרבולה|4","מקומות גאומטריים ומצבים הדדיים|5","שאלות משולבות|3"]],
["ב. וקטורים",["הגדרת וקטור ומשמעותו|2","וקטורים במישור ובמרחב|4","הצגה באמצעות רכיבים|3","חיבור, חיסור וכפל בסקלר|3","תלות ואי-תלות לינארית|4","הצגה פרמטרית של ישר|4","משוואת מישור|4","מכפלה סקלרית|5","זווית בין וקטורים|3","מצבים הדדיים של ישרים ומישורים|5","יישומים גאומטריים במרחב|5"]],
["ג. טריגונומטריה במרחב",["היכרות עם גופים במרחב|2","זווית בין ישר למישור|4","זווית בין שני מישורים|4","היטלים במרחב|3","חישוב אורכים וזוויות|3","שילוב וקטורים וטריגונומטריה|3"]],
["ד. מספרים מרוכבים",["הגדרת מספר מרוכב|2","חלק ממשי וחלק מדומה|2","ארבע פעולות החשבון|4","הצמוד של מספר מרוכב|2","מודולוס|3","הצגה במישור גאוס|2","הצגה קוטבית|4","נוסחת דה מואבר|4","שורשים של מספרים מרוכבים|4","מקומות גאומטריים במישור גאוס|4"]],
["ה. פונקציות מעריכיות ולוגריתמיות – אלגברה",["חזרה על חוקי חזקות|2","הגדרת פונקציה מעריכית|2","תכונות וגרפים של פונקציות מעריכיות|3","משוואות מעריכיות|4","הגדרת לוגריתם|2","חוקי לוגריתמים|4","משוואות לוגריתמיות|5","תחום הגדרה|3","בעיות גדילה ודעיכה|5"]],
["ו. חדו״א מעריכי ולוגריתמי",["נגזרת של פונקציות מעריכיות|4","נגזרת של פונקציות לוגריתמיות|4","כלל השרשרת ופעולות על פונקציות|3","משוואת משיק|2","חקירת פונקציות מעריכיות|4","חקירת פונקציות לוגריתמיות|5","נקודות קיצון ואסימפטוטות|3","פונקציה קדומה ואינטגרלים|4","חישובי שטחים|3","שאלות משולבות|3"]],
["ז. הכנה לבגרות 572",["גאומטריה אנליטית – שאלות בגרות|3","וקטורים – שאלות בגרות|3","מרוכבים – שאלות בגרות|3","פונקציות מעריכיות ולוגריתמיות|3","פתרון מבחנים מלאים|6","ניתוח טעויות וחזרה|3"]]
]]
];
const K="syllabus-checklist-v1";let S={};
try{S=JSON.parse(localStorage.getItem(K)||"{}")}catch(e){S={}}
function setSv(t){document.getElementById("sv").textContent=t}
function save(){
  S._t=Date.now();
  try{localStorage.setItem(K,JSON.stringify(S));setSv("נשמר במכשיר הזה")}
  catch(e){setSv("השמירה נכשלה – גבו את הנתונים עם כפתור הגיבוי")}
}
const app=document.getElementById("app");
const secs=[];
D.forEach((g,gi)=>{
  const h=document.createElement("h2");h.textContent=g[0];
  const gs=document.createElement("p");gs.className="stat";
  app.append(h,gs);
  const items=[];
  g[1].forEach((s,si)=>{
    const d=document.createElement("details");if(si===0&&gi===0)d.open=true;
    const sm=document.createElement("summary");
    const st=document.createElement("b");st.textContent=s[0];st.style.fontWeight="500";
    const cnt=document.createElement("span");
    sm.append(st,cnt);d.append(sm);
    const ul=document.createElement("ul");
    const rows=[];
    s[1].forEach((t,ti)=>{
      const [name,hrs]=t.split("|");const id=gi+"-"+si+"-"+ti;
      const st0=S[id]||{};
      const li=document.createElement("li");
      const lb=document.createElement("label");
      const cb=document.createElement("input");cb.type="checkbox";cb.checked=!!st0.d;
      const tx=document.createElement("span");tx.className="t";tx.textContent=name;
      const hh=document.createElement("span");hh.className="h";hh.textContent=hrs+" ש׳";
      lb.append(cb,tx,hh);
      const ta=document.createElement("textarea");ta.rows=1;ta.placeholder="הערות";ta.value=st0.n||"";
      ta.setAttribute("aria-label","הערות: "+name);
      li.classList.toggle("d",cb.checked);
      cb.addEventListener("change",()=>{(S[id]=S[id]||{}).d=cb.checked;li.classList.toggle("d",cb.checked);save();upd()});
      ta.addEventListener("input",()=>{(S[id]=S[id]||{}).n=ta.value;save()});
      li.append(lb,ta);ul.append(li);
      const r={id,h:+hrs,cb,ta,li};rows.push(r);items.push(r);
    });
    d.append(ul);app.append(d);
    secs.push({cnt,rows});
  });
  secs.push({gs,items,grade:true});
});
function tally(rows){let n=0,hh=0,H=0;rows.forEach(r=>{H+=r.h;if(S[r.id]&&S[r.id].d){n++;hh+=r.h}});return{n,hh,H,t:rows.length}}
function upd(){
  let all=[];
  secs.forEach(s=>{
    if(s.grade){const a=tally(s.items);s.gs.textContent=a.n+" מתוך "+a.t+" נושאים · "+a.hh+" מתוך "+a.H+" שעות";all=all.concat(s.items)}
    else{const a=tally(s.rows);s.cnt.textContent=a.n+"/"+a.t}
  });
  const a=tally(all);
  document.getElementById("pb").style.width=(a.H?a.hh/a.H*100:0)+"%";
  document.getElementById("ps").textContent="סה״כ: "+a.n+" מתוך "+a.t+" נושאים · "+a.hh+" מתוך "+a.H+" שעות";
}
function apply(){secs.forEach(s=>{(s.items||[]).forEach(r=>{const x=S[r.id]||{};r.cb.checked=!!x.d;r.li.classList.toggle("d",!!x.d);r.ta.value=x.n||""})});upd()}
upd();
setSv("נשמר במכשיר הזה");
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
document.getElementById("ex").onclick=()=>{
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));
  a.download="checklist-backup.json";document.body.append(a);a.click();a.remove();
};
const fi=document.getElementById("fi");
document.getElementById("im").onclick=()=>fi.click();
fi.onchange=()=>{
  const f=fi.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const o=JSON.parse(r.result);if(o&&typeof o==="object"){S=o;save();apply();setSv("הגיבוי שוחזר")}}catch(e){setSv("קובץ הגיבוי לא תקין")}fi.value=""};
  r.readAsText(f);
};
</script>
</body>
</html>
